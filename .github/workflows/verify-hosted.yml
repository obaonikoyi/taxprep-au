name: Verify hosted demo
on:
  push:
    branches: [main]
    paths: [deployment.json]
  pull_request:
    branches: [main]
    paths: [deployment.json]
  workflow_dispatch:
    inputs:
      demo_url:
        description: HTTPS URL of the published demo (xobapaycheck.com, taxprep.3xoba.com, or its Railway host)
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      # Two different questions, and only one of them can be answered before
      # this change is deployed.
      #
      # Is the published URL a host we actually serve? That is a property of
      # deployment.json alone, so it is checked on every event, pull request
      # included — a typo there is exactly what this workflow exists to catch.
      - name: Check the published URL
        id: url
        env:
          DEMO_URL: ${{ inputs.demo_url }}
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const u = new URL(process.env.DEMO_URL || JSON.parse(readFileSync('deployment.json', 'utf8')).url);
          // A rail, not a formality: this job can be dispatched with any URL, and
          // the smoke test drives a real browser through it. Keep it to the
          // hosts that serve this app — the published domain, the older
          // subdomain kept alive so existing links work, and the Railway
          // origin behind them, which still answers directly.
          const published = ['xobapaycheck.com', 'taxprep.3xoba.com'].includes(u.hostname) || u.hostname.endsWith('.up.railway.app');
          if (u.protocol !== 'https:' || !published) throw new Error('Expected the published demo HTTPS URL: xobapaycheck.com, taxprep.3xoba.com or a *.up.railway.app host');
          console.log(`href=${u.href}`);
          JS

      # Does the site at that URL still work? That one is about the *deployed*
      # build, which on a pull request is whatever main is serving — not this
      # branch. Running the browser journey here compares the PR's expectations
      # against the previous release and fails whenever a PR changes both
      # deployment.json and anything the journey asserts. It did exactly that
      # on the rename to Xoba Paycheck: the live site offered the old report
      # filename because the rename had not shipped yet. So the browser run
      # waits for the push to main, where the deployment it is checking is the
      # one this workflow is named after.
      #
      # And on that push it waits again, because a push starts this job and
      # the Railway deploy at the same moment — one second apart, on that same
      # rename — so browsing straight away tests the previous release just as
      # surely. The Dockerfile writes the commit it built from to /build.txt.
      # Only on a push: a manual dispatch names an arbitrary URL that has no
      # reason to serve this workflow's ref.
      - name: Wait for the deploy to be the one we are checking
        if: github.event_name == 'push'
        env:
          DEMO_URL: ${{ steps.url.outputs.href }}
          WANT: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            got=$(curl -fsS --max-time 10 "${DEMO_URL%/}/build.txt" 2>/dev/null | tr -d '[:space:]' || true)
            if [ "$got" = "$WANT" ]; then echo "Serving $WANT after $((attempt * 10))s."; exit 0; fi
            echo "Attempt $attempt: serving '${got:-nothing}', waiting for $WANT"
            sleep 10
          done
          echo "::error::$DEMO_URL never served $WANT. The deploy may have failed, or this build predates /build.txt."
          exit 1

      - name: Install browser dependencies
        if: github.event_name != 'pull_request'
        working-directory: src/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Verify public demo
        if: github.event_name != 'pull_request'
        working-directory: src/frontend
        env:
          DEMO_URL: ${{ steps.url.outputs.href }}
        run: node ./scripts/hosted-smoke.mjs

      - name: Upload hosted verification
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: hosted-verification
          path: test-results/hosted/
          retention-days: 7
