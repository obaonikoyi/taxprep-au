name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore TaxPrepAu.sln

      - name: Build
        run: dotnet build TaxPrepAu.sln --configuration Release --no-restore

      - name: API integration tests
        run: dotnet test TaxPrepAu.sln --configuration Release --no-build --logger "trx;LogFileName=api-tests.trx"

      - name: Set up Node.js for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Browser to API smoke test
        working-directory: src/frontend
        run: npm run test:e2e

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-preview-verification
          path: |
            test-results/browser/
            tests/TaxPrepAu.Api.Tests/TestResults/
          retention-days: 7
