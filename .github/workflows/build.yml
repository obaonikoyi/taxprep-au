name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore TaxPrepAu.sln

      - name: Build
        run: dotnet build TaxPrepAu.sln --configuration Release --no-restore

      - name: API integration tests
        run: dotnet test TaxPrepAu.sln --configuration Release --no-build --logger "trx;LogFileName=api-tests.trx"

      - name: Set up Node.js for browser verification
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install browser test dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: src/frontend
        run: npx playwright install --with-deps chromium

      - name: Browser to API smoke test
        working-directory: src/frontend
        run: npm run test:e2e

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: import-preview-verification
          path: |
            test-results/browser/
            tests/TaxPrepAu.Api.Tests/TestResults/
          retention-days: 7

  production:
    name: Production container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Build production image
        run: docker build -t taxprep-demo .
      - name: Start production container on a configured port
        run: |
          docker run -d --name taxprep-demo -e PORT=9090 -p 8080:9090 taxprep-demo
          curl --fail --retry 20 --retry-delay 1 --retry-all-errors --max-time 5 http://127.0.0.1:8080/api/health
      - name: Install browser dependencies
        working-directory: src/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify production visitor journey
        working-directory: src/frontend
        run: npm run test:hosted
      - name: Container logs
        if: always()
        run: docker logs taxprep-demo
      - name: Upload production verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification
          path: test-results/hosted/
          retention-days: 7
